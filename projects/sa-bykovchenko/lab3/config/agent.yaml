project:
  name: apollo11-dialog-agent
retrieval:
  store_id: efa0f2936c31e621
  mode: hybrid
  backend: hnsw
  top_k: 5
  candidate_k: 50
model:
  provider: ollama
  name: apollo-llama:16k
  base_url: http://127.0.0.1:11434/v1
  temperature: 0
  timeout_seconds: 600
  tokenizer: unsloth/Llama-3.2-3B-Instruct
  tokenizers:
    apollo-qwen:16k: Qwen/Qwen2.5-3B-Instruct
    apollo-llama:16k: unsloth/Llama-3.2-3B-Instruct
    gemma4:e2b: google/gemma-4-E2B-it
agent:
  max_model_calls: 8
  max_tool_calls: 12
  max_tool_retries: 1
  timeout_seconds: 600
memory:
  backend: sqlite
  db_path: data/agent_checkpoints.sqlite
context:
  max_tokens: 8192
  response_reserve: 512
  strategy: summarize
  keep_recent_messages: 6
